# Development environment. `docker compose up` starts:
#   - PostgreSQL on localhost:5432
#   - Rails API on http://localhost:3000
#   - React app on http://localhost:5173
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./api:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/up"]
      interval: 3s
      timeout: 5s
      retries: 60

  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # Linux node_modules live in a volume so they don't clash with the host's
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  bundle:
  web_node_modules:
