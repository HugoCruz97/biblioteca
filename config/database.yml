# Connection settings come from environment variables so the same file works
# locally, in Docker Compose, in CI and in production.
#
#   DATABASE_URL  - full connection string (takes precedence, used in production)
#   DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD - individual settings for dev/test
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: library_development

test:
  <<: *default
  database: library_test

production:
  <<: *default
  database: library_production
  url: <%= ENV["DATABASE_URL"] %>
